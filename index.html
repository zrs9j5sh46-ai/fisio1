<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Parcial de Fisiología I</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: papel de electrocardiograma (cuadrícula roja tenue) + trazo de potencial de acción como cabecera; pestañas fijas arriba, contenido a una columna de lectura */
:root {
  --paper: #fbf8f6;
  --paper-2: #f3ece8;
  --card: #ffffff;
  --ink: #1c2130;
  --ink-2: #444b5c;
  --muted: #6b7183;
  --line: #e6dcd6;
  --grid: rgba(214, 72, 72, 0.09);
  --grid-strong: rgba(214, 72, 72, 0.16);
  --signal: #c9302c;
  --signal-soft: #fbe3e1;
  --membrane: #2b5a86;
  --membrane-soft: #e2ecf6;
  --ok: #23774a;
  --ok-soft: #dff1e6;
  --warn: #a8670f;
  --warn-soft: #fbefd9;
  --bad: #b3261e;
  --bad-soft: #f9dedb;
  --heat-0: #f3ece8;
  --heat-1: #f6cfc9;
  --heat-2: #ec9d93;
  --heat-3: #d9594d;
  --heat-4: #a8231b;
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-read: "Newsreader", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161c; --paper-2: #1b1e26; --card: #1e2129; --ink: #ece8e4; --ink-2: #c9c4c0; --muted: #9a9ba6;
    --line: #2e313b; --grid: rgba(255, 110, 100, 0.05); --grid-strong: rgba(255, 110, 100, 0.09);
    --signal: #ff7468; --signal-soft: #3a2224; --membrane: #8cb8e6; --membrane-soft: #1f2c3b;
    --ok: #6fd39a; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c15; --bad: #ff8a80; --bad-soft: #3d1f1e;
    --heat-0: #1b1e26; --heat-1: #3a2426; --heat-2: #6b2f2c; --heat-3: #b0453c; --heat-4: #ff7468;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161c; --paper-2: #1b1e26; --card: #1e2129; --ink: #ece8e4; --ink-2: #c9c4c0; --muted: #9a9ba6;
  --line: #2e313b; --grid: rgba(255, 110, 100, 0.05); --grid-strong: rgba(255, 110, 100, 0.09);
  --signal: #ff7468; --signal-soft: #3a2224; --membrane: #8cb8e6; --membrane-soft: #1f2c3b;
  --ok: #6fd39a; --ok-soft: #173326; --warn: #f0b45a; --warn-soft: #3a2c15; --bad: #ff8a80; --bad-soft: #3d1f1e;
  --heat-0: #1b1e26; --heat-1: #3a2426; --heat-2: #6b2f2c; --heat-3: #b0453c; --heat-4: #ff7468;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; font-weight: 800; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--membrane); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Cabecera */
header.hero { padding-block: 28px 8px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: end; }
.hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; line-height: 1.02; letter-spacing: -0.03em; }
.hero h1 em { font-style: normal; color: var(--signal); }
.hero .sub { margin-top: 10px; color: var(--ink-2); max-width: 46ch; }
.trace { width: 100%; height: auto; display: block; }
.trace .axis { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.trace .lbl { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.trace .ap { fill: none; stroke: var(--signal); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1400; stroke-dashoffset: 0; animation: draw 2.4s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .trace .ap { animation: none; } }

/* Pestañas */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid transparent; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab:hover { background: var(--paper-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab .count { font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.7; margin-left: 4px; }

main { padding-block: 24px 64px; }
section.view { display: grid; gap: 22px; }
.lead { color: var(--ink-2); max-width: 70ch; }

/* Tarjetas y bloques */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.kpi b { display: block; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 0.85rem; }
.kpi.alert b { color: var(--signal); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

/* Barras por tema */
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 46px; gap: 10px; align-items: center; }
.bar-row .t { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); text-align: right; }
.bar-row .name { font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { position: relative; height: 22px; border-radius: 4px; background: var(--paper-2); overflow: hidden; display: flex; }
.bar-seg { height: 100%; }
.bar-seg.test { background: var(--signal); }
.bar-seg.corta { background: var(--membrane); }
.bar-label { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 0.78rem; font-weight: 600; color: var(--ink); mix-blend-mode: normal; pointer-events: none; white-space: nowrap; }
.bar-row .n { font-family: var(--font-mono); font-size: 0.85rem; text-align: right; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Mapa de calor */
.heat-wrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 3px; font-size: 0.8rem; }
table.heat th { font-weight: 600; color: var(--muted); font-size: 0.72rem; text-align: center; padding: 2px 4px; white-space: nowrap; }
table.heat th.row { text-align: left; font-family: var(--font-mono); }
table.heat td { width: 44px; min-width: 44px; height: 28px; text-align: center; border-radius: 4px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.h0 { background: var(--heat-0); color: var(--muted); }
.h1 { background: var(--heat-1); color: var(--ink); }
.h2 { background: var(--heat-2); color: var(--ink); }
.h3 { background: var(--heat-3); color: #fff; }
.h4 { background: var(--heat-4); color: #fff; }

/* Filtros */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters .grow { flex: 1 1 220px; min-width: 0; }
input[type="search"], select, textarea, input[type="number"] { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input[type="search"] { width: 100%; }
textarea { width: 100%; min-height: 110px; resize: vertical; font-family: var(--font-read); font-size: 1rem; line-height: 1.5; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.88rem; color: var(--ink-2); cursor: pointer; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--paper-2); filter: none; }
.btn.accent { background: var(--signal); border-color: var(--signal); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }
.results-meta { font-size: 0.85rem; color: var(--muted); }

/* Preguntas */
.qlist { display: grid; gap: 12px; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.q.flag-discrepancia { border-left: 4px solid var(--warn); }
.q.flag-dudosa { border-left: 4px solid var(--bad); }
.q-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); white-space: nowrap; }
.chip.tema { font-family: var(--font-mono); background: var(--membrane-soft); color: var(--membrane); }
.chip.test { background: var(--signal-soft); color: var(--signal); }
.chip.corta { background: var(--membrane-soft); color: var(--membrane); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.hot { background: var(--signal); color: #fff; }
.q-text { font-family: var(--font-read); font-size: 1.08rem; line-height: 1.45; }
.opts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; text-align: left; width: 100%; }
.opt .l { font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .l { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.docmark { box-shadow: inset 0 0 0 1px var(--warn); }
.opt.chosen { border-color: var(--membrane); background: var(--membrane-soft); }
.hide-sol .sol, .hide-sol .opt.correct:not(.revealed) { }
.sol { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--paper-2); font-size: 0.92rem; }
.sol .src { font-size: 0.8rem; color: var(--muted); }
.disc { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 0.9rem; }
.disc b { color: var(--warn); }
.apps { font-size: 0.8rem; color: var(--muted); }
.more { display: flex; justify-content: center; }
details > summary { cursor: pointer; font-weight: 600; color: var(--membrane); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-family: var(--font-mono); }
details[open] > summary::before { content: "− "; }
.model { font-family: var(--font-read); font-size: 1rem; line-height: 1.55; display: grid; gap: 6px; }
.model ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; }

/* Repetidas */
.cluster { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start; }
.cluster .times { text-align: center; border-radius: 8px; padding: 8px 0; background: var(--signal-soft); color: var(--signal); }
.cluster .times b { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.cluster .times span { font-size: 0.7rem; }
.variants { margin: 6px 0 0; padding-left: 18px; font-family: var(--font-read); color: var(--ink-2); display: grid; gap: 3px; }

/* Predicción */
.pred { display: grid; gap: 10px; }
.pred-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.level { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.meter { display: flex; gap: 3px; margin-top: 6px; }
.meter i { width: 16px; height: 6px; border-radius: 2px; background: var(--paper-2); }
.meter i.on { background: var(--signal); }
.pred-item .why { color: var(--ink-2); font-size: 0.92rem; margin-top: 4px; }

/* Simulacro */
.config { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.field { display: grid; gap: 6px; align-content: start; }
.field label.t { font-weight: 600; font-size: 0.9rem; }
.temas-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.temas-pick label { font-family: var(--font-mono); font-size: 0.78rem; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; background: var(--card); }
.temas-pick input { margin-right: 4px; }
.runner-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; flex: 1 1 200px; }
.progress i { display: block; height: 100%; background: var(--signal); transition: width 0.3s; }
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.score .big { font-size: 3.4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.grade { padding: 12px 14px; border-radius: 8px; background: var(--membrane-soft); font-size: 0.92rem; display: grid; gap: 6px; }
.note { font-size: 0.85rem; color: var(--muted); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.hist { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.hist th, .hist td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.hist td.mono { font-variant-numeric: tabular-nums; }
.sync { font-size: 0.78rem; color: var(--muted); }

/* Enlaces a páginas y visor */
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--muted); }
.ref { font: inherit; font-size: 0.78rem; font-weight: 600; color: var(--membrane); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.ref:hover { background: var(--membrane-soft); border-color: var(--membrane); }
.ref.exam { color: var(--signal); }
.ref.exam:hover { background: var(--signal-soft); border-color: var(--signal); }
.viewer { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr); background: color-mix(in srgb, var(--paper) 35%, #0b0d12); }
.viewer-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--card); border-bottom: 1px solid var(--line); }
.viewer-title { display: grid; min-width: 0; }
.viewer-title b { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-title span { font-size: 0.8rem; color: var(--muted); }
.viewer-title .cited { color: var(--ok); font-weight: 600; }
.viewer-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.viewer-body { overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; align-items: flex-start; }
.viewer-body img { display: block; width: min(860px, 100%); max-width: none; height: auto; background: #fff; border-radius: 4px; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.35); }
.viewer.zoom .viewer-body { justify-content: flex-start; }
.viewer.zoom .viewer-body img { width: max(1100px, 100%); }
.viewer-msg { color: #e8e6e3; padding: 40px 16px; text-align: center; }

@media (max-width: 760px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two, .config { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: 30px minmax(0, 1fr) 36px; }
  .pred-item { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .score { grid-template-columns: minmax(0, 1fr); }
}
</style>

<header class="hero">
  <div class="wrap hero-grid">
    <div>
      <p class="eyebrow">2º Farmacia · Universidad de Salamanca · Temas 1–16</p>
      <h1>Parcial de <em>Fisiología</em> y Fisiopatología I</h1>
      <p class="sub" id="hero-sub"></p>
    </div>
    <svg class="trace" viewBox="0 0 520 170" role="img" aria-label="Trazo de un potencial de acción: reposo, umbral, pico de despolarización e hiperpolarización">
      <line class="axis" x1="52" x2="515" y1="110" y2="110"></line>
      <line class="axis" x1="52" x2="515" y1="92" y2="92"></line>
      <line class="axis" x1="52" x2="515" y1="22" y2="22"></line>
      <text class="lbl" x="0" y="26">pico</text>
      <text class="lbl" x="0" y="96">umbral</text>
      <text class="lbl" x="0" y="114">reposo</text>
      <text class="lbl" x="452" y="160">mV / ms</text>
      <path class="ap" d="M52 110 L150 110 C165 110 172 104 178 92 C184 78 188 40 196 22 C203 10 208 16 212 40 C218 80 224 118 236 124 C252 132 270 126 290 116 C310 110 330 110 360 110 L515 110"></path>
    </svg>
  </div>
</header>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap tabs-inner" role="tablist" id="tabs"></div>
</nav>

<main class="wrap">
  <section class="view" id="v-resumen" data-view="resumen"></section>
  <section class="view" id="v-banco" data-view="banco" hidden></section>
  <section class="view" id="v-repetidas" data-view="repetidas" hidden></section>
  <section class="view" id="v-cortas" data-view="cortas" hidden></section>
  <section class="view" id="v-prediccion" data-view="prediccion" hidden></section>
  <section class="view" id="v-simulacro" data-view="simulacro" hidden></section>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-doc">
  <div class="viewer-bar">
    <div class="viewer-title"><b id="viewer-doc"></b><span id="viewer-page"></span></div>
    <div class="viewer-tools">
      <button class="btn ghost" type="button" id="viewer-prev" aria-label="Página anterior">Anterior</button>
      <button class="btn ghost" type="button" id="viewer-next" aria-label="Página siguiente">Siguiente</button>
      <button class="btn ghost" type="button" id="viewer-zoom">Ampliar</button>
      <button class="btn" type="button" id="viewer-close">Cerrar</button>
    </div>
  </div>
  <div class="viewer-body" id="viewer-body"><img id="viewer-img" alt=""></div>
</div>

<script type="application/json" id="data"></script>
<script type="text/plain" id="app-code">
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const Q = DATA.preguntas;
  const QBYID = Object.fromEntries(Q.map(q => [q.id, q]));
  const TEMAS = DATA.temas;
  const TEMA = Object.fromEntries(TEMAS.map(t => [t.n, t]));
  const FUENTES = DATA.fuentes;
  const FUENTE = Object.fromEntries(FUENTES.map(f => [f.id, f]));

  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => String(n).replace(".", ",");
  const temaLabel = n => TEMA[n] ? `T${n}` : "T?";
  const temaName = n => TEMA[n] ? TEMA[n].titulo : "Sin tema";
  const rich = txt => {
    if (!txt) return "";
    const lines = String(txt).split(/\n+/);
    let html = "", inList = false;
    for (const raw of lines) {
      const l = raw.trim();
      if (!l) continue;
      if (/^[-•·*]\s+/.test(l)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${esc(l.replace(/^[-•·*]\s+/, ""))}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        html += `<p>${esc(l)}</p>`;
      }
    }
    if (inList) html += "</ul>";
    return html;
  };
  const PAGS = DATA.paginas || {};
  const pad3 = n => String(n).padStart(3, "0");
  const pageRange = ps => ps.length === 1 ? `p. ${ps[0]}` : (ps[ps.length - 1] - ps[0] === ps.length - 1 ? `p. ${ps[0]}–${ps[ps.length - 1]}` : `p. ${ps.join(", ")}`);
  const appsText = q => {
    const a = q.apariciones || [];
    if (!a.length) return "";
    return a.map(x => {
      const f = FUENTE[x.fuente];
      const label = esc((f ? f.label : x.fuente) + (x.n != null ? ` · nº ${x.n}` : ""));
      return x.code && PAGS[x.code] ? `<button type="button" class="ref exam" data-viewer="${x.code}" data-page="${x.pag}" data-cited="${x.pag}" title="Ver la página ${x.pag} del documento original">${label} · pág. ${x.pag}</button>` : `<span>${label}${x.pag ? ` · pág. ${x.pag}` : ""}</span>`;
    }).join(" ");
  };
  // Botones a las páginas de los apuntes donde está la respuesta
  const refChips = q => {
    const r = (q.refs || []).filter(x => PAGS[x.doc]);
    if (!r.length) return "";
    return `<div class="refs"><span>Consultar en los apuntes:</span>${r.map(x => `<button type="button" class="ref" data-viewer="${x.doc}" data-page="${x.pages[0]}" data-cited="${x.pages.join(",")}">${esc(PAGS[x.doc].label)} · ${pageRange(x.pages)}</button>`).join("")}</div>`;
  };
  const veces = q => q.veces != null ? q.veces : (q.apariciones || []).length;

  /* ---------- Visor de páginas ---------- */
  const viewer = { code: null, list: [], i: 0, cited: [] };
  function openViewer(code, page, cited) {
    const d = PAGS[code]; if (!d) return;
    viewer.code = code; viewer.list = d.pages; viewer.cited = cited || [page];
    viewer.i = Math.max(0, d.pages.indexOf(page));
    $("#viewer").hidden = false;
    document.documentElement.style.overflow = "hidden";
    showViewerPage();
    $("#viewer-close").focus();
  }
  function showViewerPage() {
    const d = PAGS[viewer.code], p = viewer.list[viewer.i];
    $("#viewer-doc").textContent = d.label;
    const isCited = viewer.cited.includes(p);
    $("#viewer-page").innerHTML = `Página ${p}${isCited ? ` · <span class="cited">la que se cita</span>` : ""}`;
    const img = $("#viewer-img");
    img.alt = `${d.label}, página ${p}`;
    img.src = `pag/${viewer.code}/${pad3(p)}.jpg`;
    $("#viewer-prev").disabled = viewer.i === 0;
    $("#viewer-next").disabled = viewer.i >= viewer.list.length - 1;
    $("#viewer-body").scrollTop = 0;
    const nx = viewer.list[viewer.i + 1];
    if (nx) { const pre = new Image(); pre.src = `pag/${viewer.code}/${pad3(nx)}.jpg`; }
  }
  function closeViewer() {
    $("#viewer").hidden = true;
    document.documentElement.style.overflow = "";
    $("#viewer").classList.remove("zoom");
    $("#viewer-zoom").textContent = "Ampliar";
  }
  function moveViewer(step) {
    const j = viewer.i + step;
    if (j < 0 || j >= viewer.list.length) return;
    viewer.i = j; showViewerPage();
  }
  $("#viewer-prev").addEventListener("click", () => moveViewer(-1));
  $("#viewer-next").addEventListener("click", () => moveViewer(1));
  $("#viewer-close").addEventListener("click", closeViewer);
  $("#viewer-zoom").addEventListener("click", () => {
    const z = $("#viewer").classList.toggle("zoom");
    $("#viewer-zoom").textContent = z ? "Ajustar" : "Ampliar";
  });
  $("#viewer-img").addEventListener("error", () => { $("#viewer-page").textContent = "No se ha podido cargar esta página."; });
  document.addEventListener("keydown", e => {
    if ($("#viewer").hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") moveViewer(-1);
    else if (e.key === "ArrowRight") moveViewer(1);
  });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-viewer]");
    if (!b) return;
    e.preventDefault();
    openViewer(b.dataset.viewer, Number(b.dataset.page), String(b.dataset.cited || b.dataset.page).split(",").map(Number));
  });

  /* ---------- Progreso: base de datos privada del artifact con respaldo local ---------- */
  const LS_KEY = "fisio1-progreso-v1";
  const progress = {
    state: { respuestas: {}, historial: [], cortas: {} },
    ref: null, mode: "local", saving: false, dirty: false, timer: null,
    loadLocal() { try { const s = localStorage.getItem(LS_KEY); if (s) this.state = Object.assign(this.state, JSON.parse(s)); } catch (e) {} },
    saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.state)); } catch (e) {} },
    async connect() {
      try {
        if (!window.claude || !window.claude.use) return;
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db || !user) return;
        const id = await user.id();
        if (!id) return;
        this.ref = db.doc("data/users/" + id + "/progreso");
        const snap = await this.ref.get();
        if (snap.exists) {
          const remote = snap.data();
          this.state = mergeProgress(this.state, remote);
        }
        this.mode = "db";
        renderSync();
        rerenderProgressViews();
      } catch (e) { this.ref = null; this.mode = "local"; renderSync(); }
    },
    touch() {
      this.saveLocal();
      if (!this.ref) return;
      this.dirty = true;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 1500);
    },
    async flush() {
      if (!this.ref || this.saving || !this.dirty) return;
      this.saving = true; this.dirty = false;
      try { await this.ref.set(JSON.parse(JSON.stringify(this.state))); }
      catch (e) { if (e && e.code === "invalid_argument") { this.ref = null; this.mode = "local"; renderSync(); } }
      finally { this.saving = false; if (this.dirty) this.flush(); }
    },
    record(qid, ok) {
      const r = this.state.respuestas[qid] || { ok: 0, ko: 0 };
      if (ok) r.ok++; else r.ko++;
      r.last = ok ? 1 : 0;
      this.state.respuestas[qid] = r;
      this.touch();
    }
  };
  function mergeProgress(a, b) {
    const out = { respuestas: Object.assign({}, a.respuestas), historial: [], cortas: Object.assign({}, a.cortas || {}, (b && b.cortas) || {}) };
    for (const [k, v] of Object.entries((b && b.respuestas) || {})) {
      const x = out.respuestas[k];
      out.respuestas[k] = !x ? v : { ok: Math.max(x.ok, v.ok), ko: Math.max(x.ko, v.ko), last: v.last };
    }
    const seen = new Set();
    for (const h of [...((b && b.historial) || []), ...(a.historial || [])]) {
      if (seen.has(h.t)) continue; seen.add(h.t); out.historial.push(h);
    }
    out.historial.sort((x, y) => y.t - x.t);
    out.historial = out.historial.slice(0, 40);
    return out;
  }
  function renderSync() {
    document.querySelectorAll("[data-sync]").forEach(el => {
      el.textContent = progress.mode === "db"
        ? "Tu progreso se guarda en tu cuenta y lo verás igual en el móvil y en el ordenador."
        : "Tu progreso se guarda en este navegador.";
    });
  }

  /* ---------- Pestañas ---------- */
  const VIEWS = [
    { id: "resumen", label: "Resumen" },
    { id: "banco", label: "Banco de preguntas", count: () => Q.filter(q => q.tipo === "test").length },
    { id: "repetidas", label: "Repetidas", count: () => DATA.clusters.filter(c => c.veces >= 2).length },
    { id: "cortas", label: "Preguntas cortas", count: () => Q.filter(q => q.tipo !== "test").length },
    { id: "prediccion", label: "Predicción" },
    { id: "simulacro", label: "Simulacro" }
  ];
  const rendered = {};
  function showView(id) {
    if (!VIEWS.some(v => v.id === id)) id = "resumen";
    document.querySelectorAll(".view").forEach(s => { s.hidden = s.dataset.view !== id; });
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === id)));
    if (!rendered[id]) { RENDER[id](); rendered[id] = true; }
    try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (e) {}
  }
  function buildTabs() {
    $("#tabs").innerHTML = VIEWS.map(v => `<button class="tab" role="tab" data-view="${v.id}">${v.label}${v.count ? `<span class="count">${v.count()}</span>` : ""}</button>`).join("");
    $("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) { showView(b.dataset.view); window.scrollTo({ top: $("header.hero").offsetHeight, behavior: "smooth" }); } });
  }
  function goBanco(filter) {
    Object.assign(bancoState, { tema: "", tipo: "test", texto: "", soloDisc: false, soloRep: false, cluster: "" }, filter);
    rendered.banco = false;
    showView("banco");
  }

  /* ---------- Resumen ---------- */
  function temaStats(mode) {
    const s = {};
    for (const t of TEMAS) s[t.n] = { test: 0, corta: 0, testU: 0, cortaU: 0 };
    for (const q of Q) {
      if (!s[q.tema]) continue;
      const k = q.tipo === "test" ? "test" : "corta";
      const v = mode === "examen" ? (q.veces_examen || 0) : Math.max(1, veces(q));
      s[q.tema][k] += v;
      if (v) s[q.tema][k + "U"] += 1;
    }
    return s;
  }
  let statsMode = "examen";
  function renderResumen() {
    const el = $("#v-resumen");
    const st = temaStats(statsMode);
    const nTest = Q.filter(q => q.tipo === "test").length;
    const nCorta = Q.length - nTest;
    const nApar = Q.reduce((a, q) => a + Math.max(1, veces(q)), 0);
    const nDisc = Q.filter(q => q.estado === "discrepancia").length;
    const nDud = Q.filter(q => q.estado === "dudosa").length;
    const order = TEMAS.map(t => t.n);
    const max = Math.max(1, ...order.map(n => st[n].test + st[n].corta));
    const ranking = order.slice().sort((a, b) => (st[b].test + st[b].corta) - (st[a].test + st[a].corta));

    const bars = order.map(n => {
      const v = st[n], tot = v.test + v.corta;
      return `<div class="bar-row" title="${esc(temaName(n))}: ${v.test} apariciones en test, ${v.corta} en preguntas cortas">
        <span class="t">T${n}</span>
        <div><div class="name">${esc(temaName(n))}</div>
          <div class="bar-track"><div class="bar-seg test" style="width:${(v.test / max * 100).toFixed(1)}%"></div><div class="bar-seg corta" style="width:${(v.corta / max * 100).toFixed(1)}%"></div></div></div>
        <span class="n">${tot}</span></div>`;
    }).join("");

    // mapa de calor tema × fuente (solo fuentes con preguntas)
    const fu = FUENTES.filter(f => f.mostrar_mapa !== false);
    const cell = {};
    for (const q of Q) for (const a of (q.apariciones || [])) {
      const key = q.tema + "|" + a.fuente; cell[key] = (cell[key] || 0) + 1;
    }
    const cmax = Math.max(1, ...Object.values(cell));
    const lvl = v => v === 0 ? 0 : Math.min(4, Math.ceil(v / cmax * 4));
    const heat = `<table class="heat"><thead><tr><th></th>${fu.map(f => `<th title="${esc(f.label)}">${esc(f.corto || f.label)}</th>`).join("")}</tr></thead><tbody>
      ${order.map(n => `<tr><th class="row" title="${esc(temaName(n))}">T${n}</th>${fu.map(f => { const v = cell[n + "|" + f.id] || 0; return `<td class="h${lvl(v)}">${v || "·"}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table>`;

    const top3 = ranking.slice(0, 3).map(n => `<b>T${n}</b> ${esc(temaName(n))} (${st[n].test + st[n].corta})`).join(", ");
    const low = ranking.slice(-3).reverse().map(n => `T${n} ${esc(temaName(n))}`).join(", ");

    el.innerHTML = `
      <div class="kpis">
        <div class="kpi"><b>${nTest}</b><span>preguntas de test distintas</span></div>
        <div class="kpi"><b>${nCorta}</b><span>preguntas cortas y de desarrollo</span></div>
        <div class="kpi"><b>${FUENTES.filter(f => f.n > 0).length}</b><span>documentos analizados</span></div>
        <div class="kpi alert"><b>${nDisc + nDud}</b><span>soluciones corregidas o dudosas</span></div>
      </div>
      <div class="panel" style="display:grid;gap:14px">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end">
          <div><p class="eyebrow">Qué temas salen más</p><h2>Apariciones por tema</h2></div>
          <div class="legend"><span><i style="background:var(--signal)"></i>Test</span><span><i style="background:var(--membrane)"></i>Cortas y desarrollo</span></div>
        </div>
        <div class="filters"><label class="check"><input type="radio" name="smode" value="examen" ${statsMode === "examen" ? "checked" : ""}>Solo exámenes reales y recopilaciones de exámenes</label><label class="check"><input type="radio" name="smode" value="todos" ${statsMode === "todos" ? "checked" : ""}>Todos los documentos, también bancos de práctica</label></div>
        <p class="lead">Cuenta cada vez que una pregunta aparece en un documento distinto: si la misma pregunta sale en tres exámenes, suma tres. ${statsMode === "examen" ? "Los bancos de práctica no cuentan aquí, porque reparten las preguntas por igual entre temas y no dicen nada de lo que pregunta el profesor." : ""} Los que más salen: ${top3}. Los que menos: ${esc(low)}.</p>
        <div class="bars">${bars}</div>
        <p class="note">El tema 16 (transmisión de las señales nerviosas) va en el temario justo después del tema 6, aunque tenga el número 16.</p>
      </div>
      <div class="panel" style="display:grid;gap:12px">
        <div><p class="eyebrow">De dónde sale cada tema</p><h2>Tema × documento</h2></div>
        <p class="lead">Cada casilla es el número de preguntas de ese tema en ese documento. Cuanto más rojo, más preguntas.</p>
        <div class="heat-wrap">${heat}</div>
      </div>
      <div class="two">
        <div class="panel" style="display:grid;gap:10px">
          <p class="eyebrow">Hallazgos</p><h3>Lo más importante del análisis</h3>
          <div class="model">${rich((DATA.hallazgos || []).map(h => "- " + h).join("\n"))}</div>
        </div>
        <div class="panel" style="display:grid;gap:10px">
          <p class="eyebrow">Fuentes</p><h3>Documentos analizados</h3>
          <div style="display:grid;gap:8px;font-size:0.88rem">${FUENTES.map(f => `<div><b>${esc(f.label)}</b> <span class="mono" style="color:var(--muted)">${f.n} preg.</span><div class="note">${esc(f.descripcion || "")}</div></div>`).join("")}</div>
        </div>
      </div>
      <div class="panel" style="display:grid;gap:8px">
        <p class="eyebrow">Cómo se han comprobado las soluciones</p>
        <div class="model">${rich(DATA.metodo || "")}</div>
      </div>`;
    el.querySelectorAll('input[name="smode"]').forEach(r => r.addEventListener("change", e => { statsMode = e.target.value; renderResumen(); }));
  }

  /* ---------- Banco ---------- */
  const bancoState = { tema: "", tipo: "test", texto: "", soloDisc: false, soloRep: false, cluster: "", ocultar: false, limite: 40 };
  function temaOptions(sel) {
    return `<option value="">Todos los temas</option>` + TEMAS.map(t => `<option value="${t.n}" ${String(sel) === String(t.n) ? "selected" : ""}>T${t.n} · ${esc(t.titulo)}</option>`).join("");
  }
  function qCard(q, opts = {}) {
    const flags = [];
    if (q.estado === "discrepancia") flags.push(`<span class="chip warn">Solución corregida</span>`);
    if (q.estado === "dudosa") flags.push(`<span class="chip bad">Dudosa</span>`);
    if (q.estado === "sin_marca" && q.tipo === "test") flags.push(`<span class="chip" title="Ningún documento marcaba la respuesta; está resuelta con los apuntes">Resuelta con apuntes</span>`);
    if (veces(q) >= 2) flags.push(`<span class="chip hot">Salió ${veces(q)} veces</span>`);
    const head = `<div class="q-head"><span class="chip tema" title="${esc(temaName(q.tema))}">${temaLabel(q.tema)} · ${esc(temaName(q.tema))}</span><span class="chip ${q.tipo === "test" ? "test" : "corta"}">${q.tipo === "test" ? "Test" : q.tipo === "corta" ? "Corta" : "Desarrollo"}</span>${flags.join("")}</div>`;
    const hide = opts.ocultar;
    let body = `<p class="q-text">${esc(q.enunciado)}</p>`;
    if (q.tipo === "test" && q.opciones) {
      body += `<div class="opts" role="list">` + Object.entries(q.opciones).map(([k, v]) => {
        const cls = ["opt"];
        if (!hide && k === q.correcta) cls.push("correct");
        if (!hide && q.respuesta_doc && q.respuesta_doc !== q.correcta && k === q.respuesta_doc && q.estado === "discrepancia") cls.push("docmark");
        return `<button type="button" class="${cls.join(" ")}" data-q="${q.id}" data-k="${k}"><span class="l">${k})</span><span>${esc(v)}</span></button>`;
      }).join("") + `</div>`;
    }
    const sol = [];
    if (q.explicacion) sol.push(`<div>${rich(q.explicacion)}</div>`);
    if (q.fuente_solucion) sol.push(`<p class="src">Fuente: ${esc(q.fuente_solucion)}</p>`);
    let solHtml = sol.length ? `<div class="sol">${sol.join("")}</div>` : "";
    if (q.estado === "discrepancia" || q.estado === "dudosa") solHtml += `<div class="disc"><b>${q.estado === "dudosa" ? "Dudosa: " : "Ojo: "}</b>${esc(q.nota_discrepancia || "")}</div>`;
    if (q.tipo !== "test" && q.respuesta_modelo) solHtml = `<details ${opts.abrir ? "open" : ""}><summary>Respuesta modelo</summary><div class="model" style="margin-top:8px">${rich(q.respuesta_modelo)}</div></details>` + solHtml;
    const apps = appsText(q);
    return `<article class="q ${q.estado === "discrepancia" ? "flag-discrepancia" : q.estado === "dudosa" ? "flag-dudosa" : ""}" id="q-${q.id}">${head}${body}<div class="solbox" ${hide ? "hidden" : ""}>${solHtml}</div>${refChips(q)}${apps ? `<div class="refs"><span>Aparece en:</span>${apps}</div>` : ""}</article>`;
  }
  function filterBanco() {
    const s = bancoState, txt = s.texto.trim().toLowerCase();
    return Q.filter(q => {
      if (s.tipo === "test" && q.tipo !== "test") return false;
      if (s.tipo === "cortas" && q.tipo === "test") return false;
      if (s.tema && String(q.tema) !== String(s.tema)) return false;
      if (s.soloDisc && !(q.estado === "discrepancia" || q.estado === "dudosa")) return false;
      if (s.soloRep && veces(q) < 2) return false;
      if (s.cluster && q.cluster !== s.cluster) return false;
      if (txt) {
        const hay = (q.enunciado + " " + Object.values(q.opciones || {}).join(" ") + " " + (q.explicacion || "")).toLowerCase();
        if (!hay.includes(txt)) return false;
      }
      return true;
    }).sort((a, b) => (a.tema_orden - b.tema_orden) || (veces(b) - veces(a)));
  }
  function renderBanco() {
    const el = $("#v-banco"), s = bancoState;
    el.innerHTML = `
      <div><p class="eyebrow">Todas las preguntas, resueltas y comprobadas</p><h2>Banco de preguntas</h2></div>
      <p class="lead">Las preguntas iguales que aparecen en varios documentos están juntas en una sola tarjeta, con la lista de dónde salieron. La opción en verde es la correcta según los apuntes. Si un documento marcaba otra, aparece con un borde ámbar y la explicación del fallo.</p>
      <div class="panel filters">
        <div class="grow"><input type="search" id="b-txt" placeholder="Buscar en enunciados y opciones" value="${esc(s.texto)}"></div>
        <select id="b-tema" aria-label="Tema">${temaOptions(s.tema)}</select>
        <select id="b-tipo" aria-label="Tipo"><option value="test" ${s.tipo === "test" ? "selected" : ""}>Test</option><option value="cortas" ${s.tipo === "cortas" ? "selected" : ""}>Cortas y desarrollo</option><option value="" ${s.tipo === "" ? "selected" : ""}>Todas</option></select>
        <label class="check"><input type="checkbox" id="b-disc" ${s.soloDisc ? "checked" : ""}>Solo corregidas o dudosas</label>
        <label class="check"><input type="checkbox" id="b-rep" ${s.soloRep ? "checked" : ""}>Solo repetidas</label>
        <label class="check"><input type="checkbox" id="b-hide" ${s.ocultar ? "checked" : ""}>Ocultar soluciones</label>
      </div>
      <div class="results-meta" id="b-meta"></div>
      <div class="qlist" id="b-list"></div>
      <div class="more"><button class="btn ghost" id="b-more" type="button">Mostrar más</button></div>`;
    const draw = () => {
      const list = filterBanco();
      $("#b-meta").textContent = `${list.length} preguntas` + (s.cluster ? ` del concepto «${(DATA.clusters.find(c => c.id === s.cluster) || {}).concepto || ""}»` : "") + (s.ocultar ? ". Pulsa una opción para comprobarla." : "");

      if (p.resp === null) { bl++; t.bl++; continue; }
      if (p.resp === q.correcta) { ok++; t.ok++; pts += 1; progress.record(q.id, true); }
      else { ko++; t.ko++; pts -= penaltyFor(q); progress.record(q.id, false); }
    }
    const n = r.preguntas.length;
    const nota = Math.max(0, pts / n * 10);
    r.res = { ok, ko, bl, nota, porTema };
    r.terminado = true;
    progress.state.historial = [{ t: Date.now(), n, ok, ko, bl, nota: Math.round(nota * 100) / 100 }, ...(progress.state.historial || [])].slice(0, 40);
    progress.touch();
    drawResult();
  }
  function drawResult() {
    const el = $("#v-simulacro"), r = sim.run, s = r.res;
    const temasRows = Object.entries(s.porTema).sort((a, b) => (TEMA[a[0]] ? TEMA[a[0]].orden : 99) - (TEMA[b[0]] ? TEMA[b[0]].orden : 99))
      .map(([t, v]) => `<tr><td>T${t} · ${esc(temaName(Number(t)))}</td><td class="mono">${v.ok}</td><td class="mono">${v.ko}</td><td class="mono">${v.bl}</td></tr>`).join("");
    el.innerHTML = `
      <div><p class="eyebrow">Resultado</p><h2>Simulacro corregido</h2></div>
      <div class="panel score"><div class="big">${fmt(s.nota.toFixed(2))}</div>
        <div><p><b>${s.ok}</b> aciertos · <b>${s.ko}</b> fallos · <b>${s.bl}</b> en blanco, de ${r.preguntas.length} preguntas de test.</p>
        <p class="note">Nota sobre 10 de la parte de test, con la penalización elegida. ${r.cortas.length ? "Las preguntas cortas están abajo para que las compares con la respuesta modelo o las corrija Claude." : ""}</p></div></div>
      <div class="panel" style="overflow-x:auto"><h3 style="margin-bottom:8px">Por tema</h3><table class="hist"><thead><tr><th>Tema</th><th>Aciertos</th><th>Fallos</th><th>Blanco</th></tr></thead><tbody>${temasRows}</tbody></table></div>
      ${r.cortas.length ? `<div style="display:grid;gap:12px"><h3>Tus preguntas cortas</h3>${r.cortas.map(c => { const q = QBYID[c.id]; return `<article class="q"><div class="q-head"><span class="chip tema">T${q.tema} · ${esc(temaName(q.tema))}</span><span class="chip corta">Corta</span></div><p class="q-text">${esc(q.enunciado)}</p><div class="sol"><b>Tu respuesta</b><div class="model">${c.texto ? rich(c.texto) : "<p>(en blanco)</p>"}</div></div><details><summary>Respuesta modelo</summary><div class="model" style="margin-top:8px">${rich(q.respuesta_modelo)}</div></details>${refChips(q)}${c.texto && !DATA.publico ? `<div><button class="btn accent" type="button" data-sgrade="${q.id}">Corregir con Claude</button></div><div data-sout="${q.id}"></div>` : ""}</article>`; }).join("")}</div>` : ""}
      <div style="display:grid;gap:12px"><h3>Revisión del test</h3>${r.preguntas.map((p, idx) => { const q = QBYID[p.id]; const st = p.resp === null ? `<span class="chip">En blanco</span>` : p.resp === q.correcta ? `<span class="chip ok">Acierto</span>` : `<span class="chip bad">Fallo</span>`; return `<article class="q"><div class="q-head"><span class="chip mono">${idx + 1}</span><span class="chip tema">T${q.tema}</span>${st}</div><p class="q-text">${esc(q.enunciado)}</p><div class="opts">${p.orden.map((k, j) => `<div class="opt ${k === q.correcta ? "correct" : p.resp === k ? "wrong" : ""}"><span class="l">${"abcdef"[j]})</span><span>${esc(q.opciones[k])}</span></div>`).join("")}</div>${q.explicacion ? `<div class="sol">${rich(q.explicacion)}${q.fuente_solucion ? `<p class="src">Fuente: ${esc(q.fuente_solucion)}</p>` : ""}</div>` : ""}${refChips(q)}</article>`; }).join("")}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn accent" type="button" id="s-again">Hacer otro simulacro</button><button class="btn ghost" type="button" id="s-fallos">Repetir solo mis fallos</button></div>`;
    $("#s-again").addEventListener("click", () => { sim.run = null; renderSimulacro(); window.scrollTo({ top: $("header.hero").offsetHeight }); });
    $("#s-fallos").addEventListener("click", () => { sim.run = null; start(Object.assign({}, sim.cfg, { origen: "fallos" })); window.scrollTo({ top: $("header.hero").offsetHeight }); });
    el.querySelectorAll("[data-sgrade]").forEach(b => b.addEventListener("click", () => {
      const q = QBYID[b.dataset.sgrade], c = r.cortas.find(x => x.id === q.id);
      gradeShort(q, c.texto, $(`[data-sout="${q.id}"]`), b);
    }));
  }
  function rerenderProgressViews() { if (rendered.simulacro && !sim.run) renderSimulacro(); }

  const RENDER = { resumen: renderResumen, banco: renderBanco, repetidas: renderRepetidas, cortas: renderCortas, prediccion: renderPrediccion, simulacro: renderSimulacro };

  /* ---------- Arranque ---------- */
  $("#hero-sub").textContent = DATA.subtitulo || "";
  progress.loadLocal();
  buildTabs();
  showView((location.hash || "").replace("#", "") || "resumen");
  progress.connect();
})();
</script>

<script>
(function () {
  "use strict";
  const ENC = JSON.parse(document.getElementById("enc").textContent);
  const KEY_LS = "fisio1-clave-v1";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const err = document.getElementById("gate-err"), btn = document.getElementById("gate-btn");

  async function deriveKey(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
    document.getElementById("data").textContent = new TextDecoder().decode(plain);
    document.getElementById("gate").remove();
    const s = document.createElement("script");
    s.textContent = document.getElementById("app-code").textContent;
    document.body.appendChild(s);
  }
  if (!window.crypto || !crypto.subtle) {
    err.textContent = "Este navegador no puede abrir la página. Ábrela desde el enlace https en Chrome, Safari o Firefox.";
    btn.disabled = true;
    return;
  }
  // clave recordada en este dispositivo
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(KEY_LS); } catch (e) {}
    if (!saved) return;
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), { name: "AES-GCM" }, false, ["decrypt"]);
      await open(key);
    } catch (e) { try { localStorage.removeItem(KEY_LS); } catch (x) {} }
  })();
  document.getElementById("gate-form").addEventListener("submit", async e => {
    e.preventDefault();
    const pass = document.getElementById("gate-pass").value.trim();
    if (!pass) return;
    const remember = document.getElementById("gate-remember").checked;
    btn.disabled = true; err.textContent = "Comprobando…";
    try {
      const key = await deriveKey(pass);
      await open(key);
      if (remember) {
        try { localStorage.setItem(KEY_LS, toB64(await crypto.subtle.exportKey("raw", key))); } catch (x) {}
      }
    } catch (x) {
      err.textContent = "Contraseña incorrecta. Revísala y vuelve a probar.";
      btn.disabled = false;
    }
  });
})();
</script>
